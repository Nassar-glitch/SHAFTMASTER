# Continuous integration (ARCHITECTURE-PLAN P2, P3, P7): the portable Core and Reporting and their tier-1 tests (tools/test.ps1 -Tier 1). The AutoCAD,
# SOLIDWORKS and WPF parts are not built here (tier 2 and 3 run locally; docs/testing/TESTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core-portable:
    name: Core and Reporting (netstandard2.0), tests (net8.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Elevator.Core and Elevator.Reporting (netstandard2.0)
        run: dotnet build ElevatorAutomation/Elevator.Reporting/Elevator.Reporting.csproj -c Release -f netstandard2.0
      - name: Tier 1 (ElevatorAutomation/tools/test.ps1, the command used locally; net8.0 suites on Linux)
        shell: pwsh
        run: ./ElevatorAutomation/tools/test.ps1 -Tier 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-net8.0
          path: ElevatorAutomation/artifacts/test-results

  windows-core-bridge:
    name: Core, Reporting and Bridge (.NET Framework 4.8, no AutoCAD / SOLIDWORKS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Elevator.Core, Elevator.Reporting and Elevator.Solution.Bridge
        run: |
          dotnet build ElevatorAutomation/Elevator.Solution.Bridge/Elevator.Solution.Bridge.csproj -c Release
          dotnet build ElevatorAutomation/Elevator.Reporting/Elevator.Reporting.csproj -c Release
